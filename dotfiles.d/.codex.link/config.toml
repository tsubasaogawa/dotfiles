developer_instructions = ""
default_permissions = "workspace-write-public-network"

[permissions.workspace-write-public-network]
description = "Workspace writes with public network access"
extends = ":workspace"

[permissions.workspace-write-public-network.network]
enabled = true

[permissions.workspace-write-public-network.network.domains]
"*" = "allow"

[shell_environment_policy]
set = {
  _CODEX_SHELL = "1"
}

[features.network_proxy]
enabled = true
allow_local_binding = true

[features.network_proxy.domains]
"**.amazonaws.com" = "allow"

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "git-branch",
  "used-tokens",
  "total-input-tokens",
  "total-output-tokens",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
]
pet = "rocky"
screen_reader_detection_done = true

[desktop]
followUpQueueMode = "queue"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[features]
js_repl = false
